name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            server/go.sum
            shared/protocol/go.sum
            shared/token/go.sum

      - name: 运行单测（集成测试由 //go:build integration 隔离，不在此 job 跑）
        run: make test
