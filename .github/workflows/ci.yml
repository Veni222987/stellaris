name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Build all modules
        run: |
          go build -o /tmp/stellaris-core ./server/cmd
          go build -o /tmp/stellaris-cli ./agent/cmd
      - name: Unit tests
        run: |
          for dir in server agent shared/protocol shared/token; do
            (cd "$dir" && go test ./...)
          done

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs: [build-go, build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Prebuild web/dist for Dockerfile.web
        run: cd web && npm ci && npm run build
      - name: Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core
        run: docker build -f deploy/Dockerfile.core -t stellaris-core:ci .
      - name: Build cli
        run: docker build -f deploy/Dockerfile.cli -t stellaris-cli:ci .
      - name: Build web
        run: docker build -f deploy/Dockerfile.web -t stellaris-web:ci .
